services:
  notifier:
    build: .
    ports:
      - "9001:9001"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
